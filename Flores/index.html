<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores Amarillas 🌻</title>
  <style>
    body {
      background-color: #fffde7;
      font-family: 'Arial', sans-serif;
      text-align: center;
      padding: 20px;
      color: #fbc02d;
    }
    h1 {
      font-size: 2.5em;
      color: #f57f17;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
    }
    .gallery img {
      width: 100%;
      max-width: 300px;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }
    .flower-icon {
      font-size: 50px;
    }
  </style>
</head>
<body>

  <div class="flower-icon">🌻✨🌻</div>
  <h1>¡Feliz 21 de Septiembre!</h1>
  <p>Para la persona más especial, unas flores amarillas y nuestros mejores momentos.</p>

  <div class="gallery">
    <!-- Reemplaza "foto1.gif" con el nombre exacto de tus archivos de imagen o GIF -->
    <img src="foto1.gif" alt="Nosotros">
    <img src="foto2.jpg" alt="Flores amarillas">
  </div>

</body>
</html>
